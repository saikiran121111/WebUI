<!doctype html>
<html>
<head><meta charset="utf-8"><title>INNER FRAME</title></head>
<body>
<label for="city">City in frame</label><input id="city" type="text">
<button id="apply" aria-label="Apply in frame">apply</button>
<script>
document.getElementById("apply").addEventListener("click", function () {
  window.top.document.title = "FECHO:" + document.getElementById("city").value;
});
</script>
</body>
</html>
