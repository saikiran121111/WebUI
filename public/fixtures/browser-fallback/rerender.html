<!doctype html>
<html>
<head><meta charset="utf-8"><title>RERENDER</title></head>
<body>
<h1>Dynamic re-render</h1>
<div id="box">
  <button id="shift" aria-label="Shift view">shift</button>
  <button id="book" aria-label="Confirm booking">book</button>
</div>
<script>
// A re-render REPLACES the nodes and FLIPS their order. Old ref ids may be
// re-stamped onto different elements — the indexer's identity guard must
// refuse the collision and recover the target by role+name instead of
// silently clicking the wrong control.
document.getElementById("box").addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("button") : null;
  if (!b) return;
  var lab = b.getAttribute("aria-label");
  if (lab === "Shift view") {
    this.innerHTML =
      '<button aria-label="Confirm booking">book</button>' +
      '<button aria-label="Shift view">shift</button>';
    document.title = "RERENDER:done";
  } else if (lab === "Confirm booking") {
    document.title = "RERENDER:confirmed";
  }
});
</script>
</body>
</html>
