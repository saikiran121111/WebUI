<!doctype html>
<html>
<head><meta charset="utf-8"><title>Shop</title></head>
<body>
<div id="bar">
  <p>We use cookies to improve your experience.</p>
  <button id="ok">Accept all cookies</button>
  <button>Continue shopping</button>
  <p>Subscribe for our newsletter and save 10%</p>
</div>
<button id="basket" aria-label="Add to basket">add</button>
<script>
// An ORDINARY consent banner must NEVER be classified as a security
// challenge — the agent just dismisses it and carries on.
document.getElementById("ok").addEventListener("click", function () {
  document.getElementById("bar").remove();
  document.title = "COOKIE:accepted";
});
</script>
</body>
</html>
