<!doctype html>
<html>
<head><meta charset="utf-8"><title>POOR DOM</title></head>
<body>
<h1>Weakly-labeled controls</h1>
<input id="search" placeholder="Search the catalog">
<button id="more">Load more</button>
<a id="dl" href="#dl" title="Download report">csv</a>
<input id="q" type="text">
<button id="ask">Run query</button>
<script>
var loads = 0;
document.getElementById("more").addEventListener("click", function () {
  loads++;
  document.title = "MORE:" + loads;
});
document.getElementById("ask").addEventListener("click", function () {
  document.title = "Q:" + document.getElementById("q").value;
});
</script>
</body>
</html>
