<!doctype html>
<html>
<head><meta charset="utf-8"><title>CANVAS AMBIG</title></head>
<body>
<canvas id="c" width="200" height="60" style="position:fixed;left:100px;top:100px;"></canvas>
<script>
// Ambiguous visual target: the (mock) vision model sees MULTIPLE plausible
// matches — grounding must REFUSE and leave the page untouched.
var c = document.getElementById("c");
var x = c.getContext("2d");
x.fillStyle = "#f59e0b";
x.fillRect(0, 0, 200, 60);
c.addEventListener("click", function () {
  document.title = "CANVAS:wrong-press";
});
window.__vision_mock__ = { multiple: true };
</script>
</body>
