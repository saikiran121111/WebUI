<!doctype html>
<html>
<head><meta charset="utf-8"><title>DOM BASIC</title></head>
<body>
<h1>Basic accessible controls</h1>
<button id="inc" aria-label="Increment counter">+1</button>
<label for="nm">Your name</label><input id="nm" type="text">
<label for="sub">Subscribe to updates</label><input id="sub" type="checkbox">
<input id="pw" type="password" aria-label="Password">
<select id="plan" aria-label="Choose plan"><option value="a">Alpha</option><option value="b">Beta</option></select>
<button id="save" aria-label="Save name">save</button>
<a id="docs" href="#docs">Docs</a>
<pre id="out"></pre>
<script>
// Records whether the transient AI highlight appeared with the required
// invariants (fixed position, no pointer capture, "AI Click" label) and was
// fully removed before the real click landed.
var HL = "__ruke_ai_highlight__";
window.__hl = null;
window.__gone = false;
new MutationObserver(function (ms) {
  for (var i = 0; i < ms.length; i++) {
    var m = ms[i];
    for (var j = 0; j < m.addedNodes.length; j++) {
      var n = m.addedNodes[j];
      if (n.nodeType === 1 && n.id === HL) {
        var lbl = n.querySelector("div");
        window.__hl = {
          pos: n.style.position,
          ptr: n.style.pointerEvents,
          label: lbl ? lbl.textContent : "",
        };
      }
    }
    for (var k = 0; k < m.removedNodes.length; k++) {
      var r = m.removedNodes[k];
      if (r.nodeType === 1 && r.id === HL) window.__gone = true;
    }
  }
}).observe(document.body, { childList: true });

var count = 0;
document.getElementById("inc").addEventListener("click", function () {
  count++;
  var h = window.__hl || {};
  document.title =
    "CNT=" + count + "|pos=" + (h.pos || "-") + "|ptr=" + (h.ptr || "-") +
    "|label=" + (h.label || "-") + "|gone=" + (window.__gone ? "yes" : "no");
});
document.getElementById("save").addEventListener("click", function () {
  document.title = "SAVED:" + document.getElementById("nm").value;
});
document.getElementById("plan").addEventListener("change", function () {
  document.title = "PLAN:" + this.value;
});
document.getElementById("nm").addEventListener("keydown", function (e) {
  if (e.key === "Enter") document.title = "KEY:" + e.key;
});
</script>
</body>
</html>
