<!doctype html>
<html>
<head><meta charset="utf-8"><title>SHADOW OPEN</title></head>
<body>
<h1>Open shadow root</h1>
<div id="host"></div>
<script>
var root = document.getElementById("host").attachShadow({ mode: "open" });
root.innerHTML = '<button id="go" aria-label="Shadow action">go</button>';
root.getElementById("go").addEventListener("click", function () {
  document.title = "SHADOW:ok";
});
</script>
</body>
</html>
