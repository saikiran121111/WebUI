                  - heading "6. Findings & Risk Notes" [level=2] [ref=f2e238]
                  - generic [ref=f2e239]:
                    - heading "What the data shows" [level=3] [ref=f2e240]
                    - list [ref=f2e241]:
                      - listitem [ref=f2e242]: FP8 is effectively free. Quality deltas (<0.5%) fall within run-to-run variance; 2.3× throughput and halved VRAM make it the default for 70B-class serving.
                      - listitem [ref=f2e243]: INT4 trades reasoning for speed. HumanEval drops 3.9% — the largest regression in the matrix. Acceptable for retrieval-heavy and extraction workloads; not recommended for code-generation paths.
                      - listitem [ref=f2e244]: MoE + microscaling is the latency winner. GPT-OSS-120B MXFP4 posts the lowest 70B-class TTFT (180 ms) despite more total parameters, because active-parameter decode is bandwidth-cheap.
                      - listitem [ref=f2e245]: INT8 W8A8 has no winning region. Slower and lower-quality than FP8 at identical memory cost on Hopper hardware.
                    - heading "Risks & caveats" [level=3] [ref=f2e246]
                    - list [ref=f2e247]:
                      - listitem [ref=f2e248]: "INT4 calibration sensitivity: AWQ quality delta ranged 1.2–2.4% across calibration sets; re-calibrate per domain before rollout."
                      - listitem [ref=f2e249]: Long-context (>32K) results not covered here; KV-cache quantization (FP8 KV) is a separate track, planned for Q4.
                      - listitem [ref=f2e250]: All figures are illustrative sample data from the pilot window; final certified numbers will be published in BENCH-2025-Q3-014-FINAL.
                    - generic [ref=f2e251]: "Next steps: (1) promote FP8 to production fleet by Oct 15; (2) pilot INT4 AWQ on the batch-extraction pipeline; (3) schedule FP8-KV-cache long-context benchmark for Nov."
                    - generic [ref=f2e252]: Prepared by the AI Platform Performance Team · Confidential — internal use only · Data marked illustrative must be replaced before external distribution.
