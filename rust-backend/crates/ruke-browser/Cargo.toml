[package]
name = "ruke-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Browser Use engine: command contract (vocabulary registry + turn metadata), typed payload schemas, and typed errors for the interactive browser runtime."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Phase 2 (host + CDP bridge): async runtime, loopback WebSocket client,
# event pump, loopback URL validation, engine state locks, logging.
tokio = { workspace = true, features = ["process", "fs"] } # tokio::process = kill_on_drop (no zombie Chromium, even on aborts); fs = downloads dir (Phase 8)
tokio-tungstenite.workspace = true
futures-util.workspace = true
url.workspace = true
parking_lot.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
