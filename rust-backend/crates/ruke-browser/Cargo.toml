[package]
name = "ruke-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Browser Use engine: command contract (vocabulary registry + turn metadata), typed payload schemas, and typed errors for the interactive browser runtime."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Phase 2 (host + CDP bridge): async runtime, loopback WebSocket client,
# event pump, loopback URL validation, engine state locks, logging.
tokio = { workspace = true, features = ["process", "fs"] } # tokio::process = kill_on_drop (no zombie Chromium, even on aborts); fs = downloads dir (Phase 8)
tokio-tungstenite.workspace = true
futures-util.workspace = true
url.workspace = true
# Phase 9 (authority): registrable-domain keying for the per-origin
# facet rules (same public-suffix library the web-search crate uses).
psl = { workspace = true }
# Phase 11 (cancellation): turn-scoped CancellationToken making parked
# approval/handoff waits interruptible (same tokio-util the chat layer uses).
tokio-util.workspace = true
# Phase 13 (history/clear-data): the native Chromium profile History
# database (rusqlite bundled — no system sqlite on Windows laptops).
rusqlite = { workspace = true }
parking_lot.workspace = true
tracing.workspace = true
# Phase 2 (Playwright MCP driver): the official Rust MCP SDK as a stdio
# CLIENT only — it talks to the pinned `@playwright/mcp` server (node
# node_modules/@playwright/mcp/cli.js). No server features; base64 for
# image content blocks; transport-child-process spawns + reaps the node
# child (process-wrap) with tokio::process semantics.
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process", "base64"] }

[dev-dependencies]
tempfile.workspace = true
