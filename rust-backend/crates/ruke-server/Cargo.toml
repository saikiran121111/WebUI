[package]
name = "ruke-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Migrated Rust backend (Rule 12 binary: ruke-server.exe). Part 4: chat transport/core (/api/chat) beside the health scaffold; no route cut-over yet."

[lib]
name = "ruke_server"
path = "src/lib.rs"

[[bin]]
name = "ruke-server"
path = "src/main.rs"

[dependencies]
ruke-contracts.workspace = true
ruke-core.workspace = true
ruke-skills.workspace = true
ruke-decision.workspace = true
ruke-attach.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
regex.workspace = true
bytes.workspace = true
futures-util.workspace = true
url.workspace = true
http-body-util.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
tower.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] } # start_paused for the retry-delay test
